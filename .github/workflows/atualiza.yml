name: Atualiza radar
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualiza
  cancel-in-progress: false
jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lê o canal e recalcula
        run: bash scripts/atualiza.sh
      - name: Salva se mudou
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_data.json dados/posts/
          if git diff --cached --quiet; then echo "sem novidade"; exit 0; fi
          git commit -m "Atualização automática $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -q || true
          git push
