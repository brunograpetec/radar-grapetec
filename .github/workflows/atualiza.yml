name: Atualiza radar
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualiza
  cancel-in-progress: false
jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Atualiza a cada 5 min por ~55 min
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fim=$(( $(date +%s) + 55*60 ))
          while [ $(date +%s) -lt $fim ]; do
            ini=$(date +%s)
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            if bash scripts/atualiza.sh; then
              git add site_data.json pcideal_data.json dados/posts/ dados/comentarios.json dados/fotos.json 2>/dev/null || git add site_data.json dados/posts/
              if ! git diff --cached --quiet; then
                git commit -qm "Atualização automática $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
                if ! git push -q; then
                  echo "push recusado, refazendo em cima do mais novo"
                  git fetch -q origin main && git rebase -q -X theirs origin/main && git push -q || { git rebase --abort 2>/dev/null; echo "push falhou"; }
                fi
                curl -s -m 20 https://purge.jsdelivr.net/gh/brunograpetec/radar-grapetec@main/site_data.json >/dev/null || true
              else
                echo "sem novidade"
              fi
            fi
            dorme=$(( 300 - ($(date +%s) - ini) ))
            [ $dorme -gt 0 ] && sleep $dorme
          done
