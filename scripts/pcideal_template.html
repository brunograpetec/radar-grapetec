<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Ideal · Grape Tec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
#pci{--bg:#0a0a0c;--s1:#141317;--s2:#1d1a22;--bd:#2a2631;--ink:#f5f3f8;--mut:#a7a1b0;--dim:#6d6776;--ac:#c77dff;--ac2:#7b2cbf;--act:#e2c4ff;--ok:#4cc28c;--okt:#8ff0c3;--warn:#ffb020;--warnt:#ffd27a;--onac:#1b0a28;--wa:#25d366;--tg:#229ed9;--mono:"JetBrains Mono",ui-monospace,monospace;
  font-family:"Readex Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow:hidden}
#pci *{box-sizing:border-box;margin:0;padding:0}
#pci .orb{position:absolute;inset:-20% -10% auto;height:520px;background:radial-gradient(closest-side,#5a189a 0,transparent 70%);opacity:.38;pointer-events:none;filter:blur(10px)}
#pci .wrap{position:relative;max-width:880px;margin:0 auto;padding:28px 18px 60px}
#pci header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
#pci .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:700;color:var(--onac);font-size:20px}
#pci .brand b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
#pci .brand span{font-size:12px;color:var(--dim)}
#pci h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px}
#pci h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac),#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent}
#pci .lead{color:var(--mut);font-size:16px;max-width:620px}
#pci .prog{display:flex;gap:6px;margin:26px 0 18px}
#pci .prog i{flex:1;height:4px;border-radius:4px;background:var(--s2)}
#pci .prog i.on{background:var(--ac)}
#pci .q{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:22px}
#pci .q h2{font-size:21px;margin-bottom:4px}
#pci .q p.h{color:var(--mut);font-size:14px;margin-bottom:16px}
#pci .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
#pci .opts.big{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
#pci .opt{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--bd);background:var(--s2);border-radius:14px;padding:14px 14px;transition:.15s;display:block}
#pci .opt:hover{border-color:var(--ac);transform:translateY(-1px)}
#pci .opt:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#pci .opt b{display:block;font-size:16px}
#pci .opt span{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
#pci .opt.sel{border-color:var(--ac);background:rgba(199,125,255,.12)}
#pci .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
#pci .lnk{all:unset;cursor:pointer;color:var(--mut);font-size:14px}
#pci .lnk:hover{color:var(--ink)}
#pci .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
#pci .chip{font-size:12px;border:1px solid var(--bd);border-radius:999px;padding:3px 10px;color:var(--mut)}
/* resultado */
#pci .hero{background:linear-gradient(135deg,rgba(123,44,191,.35),rgba(20,19,23,.9));border:1px solid var(--bd);border-radius:20px;padding:22px;margin-bottom:16px}
#pci .hero .tot{font-family:var(--mono);font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.02em}
#pci .hero .sub{color:var(--mut);font-size:14px}
#pci .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin:12px 0 6px;overflow:hidden}
#pci .bar i{display:block;height:100%;background:var(--ac);border-radius:8px}
#pci .mapa{font-weight:600;font-size:17px;margin-top:12px}
#pci .raio{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px}
#pci .raio h3,#pci .sec{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac);margin-bottom:8px;font-weight:600}
#pci .raio p{color:#ddd8e6;margin-bottom:8px;font-size:15px}
#pci .raio p:last-child{margin-bottom:0}
#pci .itl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:2px 0 8px}
#pci .its{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
#pci .it{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--s2);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;transition:.15s}
#pci .it i{font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;border:1px solid var(--bd);color:var(--mut)}
#pci .it.on{border-color:var(--ac);background:rgba(199,125,255,.12)}
#pci .it.on i{background:var(--ac);border-color:var(--ac);color:var(--onac)}
#pci .it small{font-weight:400;font-size:11.5px;color:var(--mut)}
#pci .it.lock{cursor:default;opacity:.9}
#pci .it:not(.lock):hover{border-color:var(--ac)}
#pci .nobox{display:grid;place-items:center;min-height:120px;text-align:center}
#pci tr.st td{color:var(--mut);font-size:13px;border-bottom:1px solid var(--bd)}
#pci .mx{margin-top:16px;background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:16px}
#pci .mxt{font-weight:600;margin-bottom:12px}
#pci input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--ac) 0,var(--ac) var(--v,30%),rgba(255,255,255,.12) var(--v,30%));outline:none;margin:6px 0}
#pci input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:grab;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#pci input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:grab}
#pci .mxi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:14px}
#pci .mxi small{display:block;font-size:11px;letter-spacing:.1em;color:var(--dim)}
#pci .mxi b{font-family:var(--mono);font-size:22px}
#pci .mxi span{display:block;font-family:var(--mono);font-size:13px;color:var(--mut)}
#pci .mxi>div:first-child b{color:var(--okt)}#pci .mxi>div:last-child b{color:var(--act)}
#pci .mxm{text-align:center;font-size:13px;color:var(--mut)}
#pci .mxm b{color:var(--ink);font-size:13px;font-family:inherit}
#pci .opt.go{margin-top:14px;text-align:center;background:var(--ac);color:var(--onac);border-color:var(--ac);width:100%}
@media (max-width:520px){#pci .mxi{grid-template-columns:1fr 1fr}#pci .mxm{grid-column:1/-1;grid-row:2}}
#pci .parts{display:grid;gap:12px;margin-bottom:16px}
#pci .part{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:start}
#pci .pl{display:grid;gap:8px;min-width:0}
#pci .part .k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
#pci .part .n{font-size:17px;font-weight:600;line-height:1.3;margin-top:-4px}
#pci .norte{background:var(--s2);border-left:3px solid var(--ac);border-radius:8px;padding:10px 12px;font-size:14px;color:#e4dfeb}
#pci .norte b{color:var(--act)}
#pci .why{color:#cfc9d8;font-size:14px}
#pci .xtra{font-size:13.5px;color:var(--mut);border-top:1px dashed var(--bd);padding-top:8px}
#pci .xtra b{color:var(--ink);font-weight:600}
#pci .pbox{background:var(--s2);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
#pci .ph{display:block;position:relative;aspect-ratio:1/1;background:#fff linear-gradient(135deg,#1d1a22,#141317);overflow:hidden}
#pci .ph img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
#pci .sl{white-space:nowrap;position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(10,10,12,.82);color:var(--mut);backdrop-filter:blur(4px)}
#pci .sl.hot{color:var(--okt)}#pci .sl.ok{color:var(--okt)}#pci .sl.hi{color:var(--warnt)}
#pci .pi{padding:10px 12px 12px;display:grid;gap:6px}
#pci .pp{font-family:var(--mono);font-weight:800;font-size:19px;letter-spacing:-.01em}
#pci .ps{font-size:12px;color:var(--mut);margin-top:-4px}
#pci .cupb{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--warnt);border:1px dashed rgba(255,176,32,.55);border-radius:8px;padding:5px 8px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pci .cupb:hover{background:rgba(255,176,32,.08)}
#pci .btn.buy{text-align:center;text-decoration:none}
#pci .vp{font-size:12px;color:var(--dim);text-align:center;text-decoration:none}
#pci .vp:hover{color:var(--act)}
#pci a.me{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;text-decoration:none;color:var(--onac);background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:20px;padding:18px;margin-bottom:16px;transition:.15s}
#pci a.me:hover{transform:translateY(-2px)}
#pci a.me .foto{width:120px;height:120px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid rgba(255,255,255,.6)}
#pci a.me .foto img{width:100%;height:100%;object-fit:cover}
#pci a.me small{display:block;font-size:13px;color:#3b1a55;font-weight:600}
#pci a.me b{display:block;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em;line-height:1.1;margin:2px 0 6px}
#pci a.me span{display:block;font-size:14px;color:#2a0f40}
#pci a.me span b{display:inline;font-size:inherit}
#pci a.me em{display:inline-block;font-style:normal;font-weight:700;margin-top:10px;background:var(--onac);color:var(--act);border-radius:999px;padding:7px 14px;font-size:14px}
#pci .ch{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
#pci .chb,#pci a.rd{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:18px}
#pci .ch h4{font-size:17px;margin-bottom:4px}
#pci .ch p{color:var(--mut);font-size:14px}
#pci .chr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#pci .chr a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--s2);font-weight:600;font-size:14.5px;transition:.15s}
#pci .chr a svg{width:28px;height:28px;flex:none}
#pci .chr a.wa svg{color:var(--wa)}#pci .chr a.tg svg{color:var(--tg)}
#pci .chr a.wa:hover{border-color:var(--wa)}#pci .chr a.tg:hover{border-color:var(--tg)}
#pci .chr a small{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--mut);font-weight:500}
#pci a.rd{display:flex;gap:14px;text-decoration:none;color:var(--ink);transition:.15s}
#pci a.rd:hover{border-color:var(--ac)}
#pci .rdi{width:56px;height:56px;flex:none;border-radius:14px;background:rgba(199,125,255,.12);color:var(--ac);display:grid;place-items:center}
#pci .rdi svg{width:34px;height:34px}
#pci a.rd em{display:block;font-style:normal;color:var(--act);font-size:14px;margin-top:8px;font-weight:600}
#pci img.logo{width:42px;height:42px;border-radius:12px;object-fit:contain;background:none}
@media (max-width:640px){#pci .part{grid-template-columns:1fr}#pci .pbox{display:grid;grid-template-columns:120px 1fr}#pci .ph{aspect-ratio:auto;min-height:120px}#pci a.me{grid-template-columns:76px 1fr;gap:12px}#pci a.me .foto{width:76px;height:76px}#pci .ch{grid-template-columns:1fr}#pci .sl{font-size:10px;left:6px;top:6px}}
@media (max-width:380px){#pci .chr{grid-template-columns:1fr}}
#pci .btn{all:unset;cursor:pointer;font-size:13px;border:1px solid var(--bd);border-radius:999px;padding:5px 12px;color:var(--ink)}
#pci .btn:hover{border-color:var(--ac);color:var(--act)}
#pci .cup{font-family:var(--mono);font-size:12px;color:var(--warnt);border:1px dashed rgba(255,176,32,.5);border-radius:8px;padding:3px 8px}
#pci .old{font-size:12px;color:var(--dim)}
#pci table{width:100%;border-collapse:collapse;font-size:14px}
#pci td{padding:7px 0;border-bottom:1px solid var(--bd)}
#pci td:last-child{text-align:right;font-family:var(--mono)}
#pci tr.t td{font-weight:700;border:0;padding-top:10px;font-size:16px}
#pci ul.ck{list-style:none;display:grid;gap:6px;font-size:14.5px}
#pci ul.ck li::before{content:"✔ ";color:var(--ok)}
#pci ul.no li::before{content:"✖ ";color:#ff8a8a}
#pci .cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
#pci .cta a{text-decoration:none;color:var(--ink);background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:14px;display:block}
#pci .cta a:hover{border-color:var(--ac)}
#pci .cta a b{display:block}
#pci .cta a span{font-size:13px;color:var(--mut)}
#pci .cta a.main{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);border:0}
#pci .cta a.main span{color:#3b1a55}
#pci .foot{color:var(--dim);font-size:12px;margin-top:20px}
#pci .alt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
</style>
</head>

/* ---------- Escolha das peças ---------- */
const by = (c,f) => (P[c]||[]).filter(f);
const cheapest = L => L.slice().sort((a,b)=>a.p-b.p)[0];
const isG = x => !/Genérica/.test(x.n);

function pickRam(ddr, total){
  const cap = total/2;
  const mods = by('ram', x => x.a.ddr===ddr && x.a.cap===cap && x.a.mods===1 && x.np>=3 && isG(x) && (ddr===4 ? x.a.mhz>=3200 : x.a.mhz>=5200));
  const kits = by('ram', x => x.a.ddr===ddr && x.a.cap===cap && x.a.mods===2 && isG(x) && (ddr===4 ? x.a.mhz>=3200 : x.a.mhz>=5200));
  const m = cheapest(mods), k = cheapest(kits);
  const cls = by('ram', x => x.a.ddr===ddr && x.a.cap===cap && x.a.mods===1);
  const ps = cls.map(x=>x.med).sort((a,b)=>a-b);
  const fx = ps.length ? [ps[Math.floor(ps.length*.25)], ps[Math.floor(ps.length*.75)]] : null;
  if(m && (!k || 2*m.p <= k.p)) return {it:m, preco:2*m.p, qtd:2, fx};
  if(k) return {it:k, preco:k.p, qtd:1, fx: fx && [fx[0]*2, fx[1]*2]};
  return null;
}
function pickMobo(pl, s, cpu, ctx){
  const wifi = s.net==='wifi';
  let L = by('mobo', x => x.a.Plataforma===pl && MARCA_OK.test(x.a.Marca||x.n) && x.np>=4 && (!wifi || x.a['Wi-Fi']==='Com Wi-Fi'));
  let chip, tier;
  if(pl==='AM4'){
    chip = (ctx.orc<4500 && !CPU[cpu].x3d && CPU[cpu].c<=6) ? /A520|B550/ : /B550/;
    tier = (CPU[cpu].x3d || ctx.orc>=8000) ? /TUF|Aorus|Gaming Plus|Phantom|Steel Legend/ : null;
  } else {
    chip = (ctx.orc>=10000 || s.plat==='am5') ? /B850|B650/ : /B650|B850/;
    tier = ctx.orc>=10000 ? /B850|TUF/ : null;
  }
  L = L.filter(x => chip.test(x.a.Chipset||x.n));
  if(tier){ const T = L.filter(x=>tier.test(x.n)); if(T.length) L = T; }
  const it = cheapest(L); if(!it) return null;
  const cls = by('mobo', x => x.a.Plataforma===pl && x.a.Chipset===it.a.Chipset).map(x=>x.med).sort((a,b)=>a-b);
  return {it, preco:it.p, fx:[cls[Math.floor(cls.length*.25)], cls[Math.floor(cls.length*.75)]]};
}
function pickSsd(kind){
  const cap = kind==='500'?'500GB':kind==='2t'?'2TB':'1TB';
  const g4 = kind==='1t4';
  let L = by('ssd', x => x.a.Capacidade===cap && x.np>=4 && (g4 ? /Gen4/.test(x.a.Interface) : true));
  const it = cheapest(L); if(!it) return null;
  const cls = by('ssd', x => x.a.Capacidade===cap && (g4 ? /Gen4/.test(x.a.Interface) : !/Gen4/.test(x.a.Interface))).map(x=>x.med).sort((a,b)=>a-b);
  return {it, preco:it.p, fx:[cls[Math.floor(cls.length*.25)], cls[Math.floor(cls.length*.75)]], kind};
}
function pickPsu(w, gold){
  const okW = x => { const m = (x.a['Potência']||'').match(/(\d+)W$/); const n = m?+m[1]:0; return n>=w; };
  let L = by('psu', x => FONTE_OK.test(x.n) && okW(x) && x.np>=4 && (!gold || x.a['Certificação']==='Gold'));
  if(!L.length) L = by('psu', x => okW(x) && x.np>=3 && (!gold || x.a['Certificação']==='Gold'));
  const it = cheapest(L); if(!it) return null;
  const cls = by('psu', x => okW(x) && x.a['Certificação']===it.a['Certificação']).map(x=>x.med).sort((a,b)=>a-b);
  return {it, preco:it.p, fx:[cls[0], cls[cls.length-1]], w, gold};
}
function pickCooler(wc, premium){
  let L = wc ? by('cooler', x => x.a.Tipo==='Water cooler' && /360/.test(x.n) && WC_OK.test(x.n) && x.np>=5 && (!premium || /Arctic|Thermalright/.test(x.n)))
             : by('cooler', x => x.a.Tipo==='Air cooler' && /AK400|Hyper 212|NX600|Boreal/.test(x.n) && x.np>=4);
  if(wc && premium && !L.length) return pickCooler(true,false);
  // água: prefiro o MSI A12 360 (é o que eu mais indico) se estiver na faixa
  let it = cheapest(L);
  if(wc && !premium){ const msi = L.find(x=>/MSI/.test(x.n)); if(msi && msi.p <= it.p + 80) it = msi; }
  if(!wc){ const ak = L.find(x=>/AK400/.test(x.n)); if(ak) it = ak; }
  if(!it) return null;
  const cls = L.map(x=>x.med).sort((a,b)=>a-b);
  return {it, preco:it.p, fx:[cls[0], cls[cls.length-1]], wc};
}
function pickCase(aq, wc, premium){
  let L;
  if(premium) L = by('case', x => /Lian Li|Wideload/.test(x.n));
  else if(wc) L = by('case', x => /CV700L|Wideload/.test(x.n));
  else if(aq) L = by('case', x => /CV450 \(9 fans\)|CV700L/.test(x.n));
  else L = by('case', x => /CV450$|G-Storm|Mancer CV450|Acegeek/.test(x.n) && !/9 fans/.test(x.n));
  const it = premium ? L.sort((a,b)=>b.p-a.p)[0] : cheapest(L);
  if(!it) return null;
  return {it, preco:it.p, fx:[it.p25, it.p75]};
}

const MON_OK = /AOC|LG|Acer|Gigabyte|Philips|Samsung|ASUS|MSI/;
function pickMon(res, plus){
  const RN = {fhd:'Full HD', qhd:'QHD', uhd:'4K'}[res];
  let L = by('mon', x => x.a['Resolução']===RN && /Normal/.test(x.a.Formato||'') && MON_OK.test(x.n) && !/Office/.test(x.n) && x.a.Painel!=='OLED' && x.np>=3 && (res==='uhd' || /144|200|280/.test(x.a.Taxa||'')));
  if(plus){ const T = L.filter(x => res==='fhd' ? (x.a.Tamanho==='27"' && /200|280/.test(x.a.Taxa||'')) : res==='qhd' ? /200|280/.test(x.a.Taxa||'') : true); if(T.length) L = T; }
  const it = cheapest(L); if(!it) return null;
  return {it, preco:it.p, fx:[it.p25, it.p75], res};
}
function pickPer(cat, plus){
  const RX = {mouse: plus ? /G305|King Pro/ : /G203|K1NG|King Pro|GM510/, kb: /Dark Avenger|Fizz/, head: plus ? /Zeus Pro|G335/ : /Zeus Lite|Cragblade/}[cat];
  let L = by(cat, x => RX.test(x.n) && x.np>=3);
  if(!L.length) L = by(cat, x => RX.test(x.n));
  let it = cheapest(L);
  if(cat==='kb'){ const da = L.find(x=>/Dark Avenger/.test(x.n)); if(da && da.p <= it.p + 50) it = da; }
  if(!it) return null;
  return {it, preco:it.p, fx:[it.p25, it.p75]};
}
function setup(s){
  const it = st.itens || {};
  const res = s.mon==='auto' ? (s.orc>=10000 ? 'qhd' : 'fhd') : s.mon;
  for(const plus of (s.orc>=10000 ? [true,false] : [false])){
    const acc = {};
    let ok = true, soma = 0;
    if(it.mon){ acc.mon = pickMon(res, plus); if(!acc.mon) ok = false; }
    for(const k of ['kb','mouse','head']) if(it[k]){ acc[k] = pickPer(k, plus); if(!acc[k]) ok = false; }
    if(!ok) continue;
    for(const k in acc) soma += acc[k].preco;
    const teto = s.orc * fator(s);
    const pcOrc = teto - soma;
    const b = monta(Object.assign({}, s, {orc: pcOrc, pag:'pix', mon: it.mon ? res : s.mon}));
    if(b){ b.acc = acc; b.accTot = soma; b.res = it.mon ? res : s.mon; b.pcOrc = pcOrc; b.geral = b.tot + soma; return b; }
  }
  return null;
}

function score(cpu, gpu, s, ram, ssd){
  const c = CPU[cpu], g = gpu==='iGPU' ? {i:c.ig, v:0, w:500} : GPU[gpu];
  let gi = g.i;
  if(s.mon==='qhd'){ gi *= .72; if(g.v<=8) gi *= .86; }
  if(s.mon==='uhd'){ gi *= .46; if(g.v<=8) gi *= .7; else if(g.v<=12) gi *= .9; }
  let mult = {fps:1.25, aaa:1.9, mix:1.55, work:1.6}[s.jogo];
  if(s.mon==='qhd') mult *= 1.3; if(s.mon==='uhd') mult *= 1.75; if(s.mon==='fhd60') mult *= 1.4;
  let sc = Math.min(gi, c.g*mult) + .12*Math.max(gi, c.g*mult);
  if(c.c>=8) sc += 3;                       // 8 núcleos envelhecem melhor
  if(s.jogo==='fps' && c.x3d) sc += 6;      // cache 3D no competitivo
  if(s.jogo==='work') sc = .55*sc + .45*(c.c*10*(c.pl==='AM5'?1.15:1));
  if(ram===32) sc += s.jogo==='work' ? 10 : 2.5;
  if(ssd==='1t'||ssd==='1t4') sc += 4; if(ssd==='2t') sc += 5.5; if(ssd==='1t4') sc += .5;
  if(s.plat==='auto' && c.pl==='AM5') sc *= 1.02;  // empate técnico → AM5 leva pela vida útil
  // equilíbrio: processador não pode segurar demais a placa
  if(gpu!=='iGPU' && c.g < .3*g.i + 40) sc -= 40;
  return sc;
}

function monta(s){
  const teto = s.orc * fator(s);
  const plats = s.plat==='am4' ? ['AM4'] : s.plat==='am5' ? ['AM5'] : ['AM4','AM5'];
  const ctx = {orc:s.orc};
  const aq = s.vis!=='perf', est = s.vis==='estetica';
  let best = null;
  for(const cpu in CPU){
    const C = CPU[cpu], cI = (P.cpu||[]).find(x=>x.n===cpu);
    if(!cI || !plats.includes(C.pl)) continue;
    if(s.jogo!=='work' && C.c>=12) continue;
    const mobo = pickMobo(C.pl, s, cpu, ctx); if(!mobo) continue;
    for(const gpu of (C.apu ? ['iGPU'] : Object.keys(GPU))){
      const gI = gpu==='iGPU' ? {p:0, n:'iGPU'} : (P.gpu||[]).find(x=>x.n===gpu); if(!gI) continue;
      const G = gpu==='iGPU' ? {i:C.ig, v:0, w:500} : GPU[gpu];
      for(const ram of [16,32]){
        const rr = pickRam(C.pl==='AM4'?4:5, ram); if(!rr) continue;
        for(const sk of ['500','1t','1t4','2t']){
          if(sk==='1t4' && C.pl!=='AM5') continue;
          if(sk==='500' && s.orc>=5500) continue;               // de 5,5 mil pra cima é 1TB
          if(sk==='2t' && s.orc<10000 && s.jogo!=='work') continue;
          const ss = pickSsd(sk); if(!ss) continue;
          const top = s.orc>=12000;
          const gold = (s.orc>=5500 && !C.apu) || G.w>=750;
          const w = (C.pl==='AM5' || s.orc>=8000) ? Math.max(G.w, 850) : G.w;
          const ps = pickPsu(w, gold); if(!ps) continue;
          const wc = est || C.x3d && s.orc>=8000 || s.orc>=10000 || /9700X|9900X|7900/.test(cpu);
          const co = ((C.apu || (/^Ryzen 5 (5500|5600|7600)$/.test(cpu) && s.orc<5000)) && !wc && !aq) ? {box:1, preco:0, wc:false, it:null} : pickCooler(wc, top || (est && s.orc>=8000)); if(!co) continue;
          const ca = pickCase(aq, co.wc, (top && aq) || (est && s.orc>=6000)); if(!ca) continue;
          const tot = cI.p + gI.p + mobo.preco + rr.preco + ss.preco + ps.preco + co.preco + ca.preco;
          if(tot > teto) continue;
          const sc = score(cpu, gpu, s, ram, sk);
          if(!best || sc > best.sc + .01 || (Math.abs(sc-best.sc)<=.01 && tot < best.tot))
            best = {sc, tot, cpu, gpu, cI, gI, mobo, rr, ss, ps, co, ca, ram, pl:C.pl, teto, apu:!!C.apu};
        }
      }
    }
  }
  return best;
}

const gpuNear = (name, dir) => {
  const L = Object.keys(GPU).map(n => ({n, g:GPU[n], it:(P.gpu||[]).find(x=>x.n===n)})).filter(x=>x.it).sort((a,b)=>a.g.i-b.g.i || a.it.p-b.it.p);
  const i = L.findIndex(x=>x.n===name), me = L[i];
  if(dir>0){ for(let j=i+1;j<L.length;j++) if(L[j].g.i >= me.g.i*1.08 && L[j].it.p > me.it.p) return L[j]; }
  else { for(let j=i-1;j>=0;j--) if(L[j].g.i <= me.g.i*0.95 && L[j].it.p < me.it.p) return L[j]; }
  return null;
};

}
