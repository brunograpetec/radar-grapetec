<style>
#pci{--bg:#0a0a0c;--s1:#141317;--s2:#1d1a22;--bd:#2a2631;--ink:#f5f3f8;--mut:#a7a1b0;--dim:#6d6776;--ac:#c77dff;--ac2:#7b2cbf;--act:#e2c4ff;--ok:#4cc28c;--okt:#8ff0c3;--warn:#ffb020;--warnt:#ffd27a;--onac:#1b0a28;--wa:#25d366;--tg:#229ed9;--mono:"JetBrains Mono",ui-monospace,monospace;
  font-family:"Readex Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow:hidden}

#pci .brand b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
#pci .brand span{font-size:12px;color:var(--dim)}
#pci h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px}

#pci .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}

/* resultado */

#pci input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:grab;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#pci input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--ac);cursor:grab}
#pci .mxi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:14px}
#pci .mxi small{display:block;font-size:11px;letter-spacing:.1em;color:var(--dim)}

#pci .mxm{text-align:center;font-size:13px;color:var(--mut)}
#pci .mxm b{color:var(--ink);font-size:13px;font-family:inherit}
#pci .opt.go{margin-top:14px;text-align:center;background:var(--ac);color:var(--onac);border-color:var(--ac);width:100%}
@media (max-width:520px){#pci .mxi{grid-template-columns:1fr 1fr}#pci .mxm{grid-column:1/-1;grid-row:2}}
#pci .fc{display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px}
#pci .fc span{font-size:12px;border:1px solid var(--bd);background:var(--s2);border-radius:999px;padding:2px 9px;color:#d8d2e2}
#pci .mt{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;font-size:12.5px;color:var(--mut)}
#pci .mt div{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}

#pci .tm{margin-top:2px;background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}

#pci .tmb{position:relative;height:8px;border-radius:8px;background:rgba(255,255,255,.07);margin:7px 0}
#pci .tmb .nz{position:absolute;top:0;bottom:0;background:rgba(199,125,255,.35);border-radius:8px}
#pci .tmb .pt{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--okt);border:3px solid var(--s1);box-shadow:0 0 0 1px var(--okt)}
#pci a.me b u{text-decoration:none;background:linear-gradient(transparent 82%,rgba(123,44,191,.75) 82%,rgba(123,44,191,.75) 94%,transparent 94%)}

#pci .sv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}

    --bg:#fff;--s1:#fff;--s2:#f5f2f9;--bd:#ddd6e6;--ink:#1a1320;--mut:#5d5568;--dim:#7c7487;--act:#6a1fb0;--okt:#178a55;--warnt:#9a5b00;background:#fff!important;color:#1a1320!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

}

  #pci .tema{font-size:0;padding:6px 9px}
  #pci .tema:first-letter{font-size:16px}
  #pci header{margin-bottom:14px}
  #pci h1{font-size:30px}
  #pci .lead{font-size:14.5px}
  #pci .q{padding:16px;border-radius:16px}
  #pci .q h2{font-size:18.5px}
  #pci .q p.h{font-size:13px;margin-bottom:12px}
  #pci .opts,#pci .opts.big{grid-template-columns:1fr;gap:8px}
  #pci .opts:not(.big){grid-template-columns:repeat(3,1fr)}
  #pci .opt{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;padding:11px 12px}
  #pci .opt .ill{grid-row:1 / span 2;height:34px;margin:0}
  #pci .opt .ill svg{height:34px}
  #pci .opt .ill .bri{width:34px;height:34px}
  #pci .opt b{font-size:15px}
  #pci .opt span{margin-top:1px}
  #pci .opt .lg{display:none}
  #pci .opt .sh{display:block}
  #pci .opts:not(.big) .opt{grid-template-columns:1fr;text-align:center;padding:10px 6px}
  #pci .opts:not(.big) .opt .ill{grid-row:auto;height:26px;margin:0 auto 4px}#pci .opts:not(.big) .opt .ill svg{height:26px;margin:0 auto}
  #pci .its{gap:6px}
  #pci .it{padding:8px 10px;font-size:14px}
  #pci .it small{display:none}
  #pci .gmx{font-size:12.5px}
  #pci .mais{display:block;all:unset;cursor:pointer;font-size:13px;color:var(--act);padding:2px 0}
  #pci .part:not(.aberto) .det{display:none}
  #pci .part .n{font-size:16px}
  #pci .norte{font-size:13.5px}
  #pci .why{font-size:13.5px}
  #pci .raio{padding:16px}
  #pci .raio p{font-size:14.5px}
  #pci .hero .tot{font-size:34px}
  #pci .barra{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--bd);box-shadow:0 -8px 24px rgba(0,0,0,.35)}
  #pci .barra div{flex:1}#pci .barra small{display:block;font-size:11px;color:var(--mut)}#pci .barra b{font-family:var(--mono);font-size:19px}
}
@media print{#pci .barra,#pci .mais{display:none!important}#pci .det{display:grid!important}}
#pci .parts.fut .part{border-style:dashed;border-color:var(--ac)}
#pci .acima{border:2px solid var(--warn);background:rgba(255,176,32,.08);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:grid;gap:4px}#pci .acima b{color:var(--warnt)}#pci .acima span{font-size:14.5px;color:var(--ink)}#pci .acima span b{color:var(--ink)}
#pci .parts{display:grid;gap:12px;margin-bottom:16px}
#pci .part{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:start}
#pci .pl{display:grid;gap:8px;min-width:0}
#pci .part .k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
#pci .part .n{font-size:17px;font-weight:600;line-height:1.3;margin-top:-4px}
#pci .norte{background:var(--s2);border-left:3px solid var(--ac);border-radius:8px;padding:10px 12px;font-size:14px;color:#e4dfeb}
#pci .norte b{color:var(--act)}
#pci .why{color:#cfc9d8;font-size:14px}
#pci .xtra{font-size:13.5px;color:var(--mut);border-top:1px dashed var(--bd);padding-top:8px}
#pci .xtra b{color:var(--ink);font-weight:600}
#pci .pbox{background:var(--s2);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
#pci .ph{display:block;position:relative;aspect-ratio:1/1;background:#fff linear-gradient(135deg,#1d1a22,#141317);overflow:hidden}
#pci .ph img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
#pci .sl{white-space:nowrap;position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(10,10,12,.82);color:var(--mut);backdrop-filter:blur(4px)}
#pci .sl.hot{color:var(--okt)}#pci .sl.ok{color:var(--okt)}#pci .sl.hi{color:var(--warnt)}
#pci .pi{padding:10px 12px 12px;display:grid;gap:6px}
#pci .pp{font-family:var(--mono);font-weight:800;font-size:19px;letter-spacing:-.01em}
#pci .ps{font-size:12px;color:var(--mut);margin-top:-4px}
#pci .cupb{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--warnt);border:1px dashed rgba(255,176,32,.55);border-radius:8px;padding:5px 8px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pci .cupb:hover{background:rgba(255,176,32,.08)}
#pci .btn.buy{text-align:center;text-decoration:none}
#pci .vp{font-size:12px;color:var(--dim);text-align:center;text-decoration:none}
#pci .vp:hover{color:var(--act)}
#pci a.me{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;text-decoration:none;color:var(--onac);background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:20px;padding:18px;margin-bottom:16px;transition:.15s}
#pci a.me:hover{transform:translateY(-2px)}
#pci a.me .foto{width:120px;height:120px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid rgba(255,255,255,.6)}
#pci a.me .foto img{width:100%;height:100%;object-fit:cover}
#pci a.me small{display:block;font-size:13px;color:#3b1a55;font-weight:600}
#pci a.me b{display:block;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em;line-height:1.1;margin:2px 0 6px}
#pci a.me span{display:block;font-size:14px;color:#2a0f40}
#pci a.me span b{display:inline;font-size:inherit}
#pci a.me em{display:inline-block;font-style:normal;font-weight:700;margin-top:10px;background:var(--onac);color:var(--act);border-radius:999px;padding:7px 14px;font-size:14px}
#pci .ch{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
#pci .chb,#pci a.rd{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:18px}
#pci .ch h4{font-size:17px;margin-bottom:4px}
#pci .ch p{color:var(--mut);font-size:14px}
#pci .chr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#pci .chr a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--s2);font-weight:600;font-size:14.5px;transition:.15s}
#pci .chr a svg{width:28px;height:28px;flex:none}
#pci .chr a.wa svg{color:var(--wa)}#pci .chr a.tg svg{color:var(--tg)}
#pci .chr a.wa:hover{border-color:var(--wa)}#pci .chr a.tg:hover{border-color:var(--tg)}
#pci .chr a small{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--mut);font-weight:500}
#pci a.rd{display:flex;gap:14px;text-decoration:none;color:var(--ink);transition:.15s}
#pci a.rd:hover{border-color:var(--ac)}
#pci .rdi{width:56px;height:56px;flex:none;border-radius:14px;background:rgba(199,125,255,.12);color:var(--ac);display:grid;place-items:center}
#pci .rdi svg{width:34px;height:34px}
#pci a.rd em{display:block;font-style:normal;color:var(--act);font-size:14px;margin-top:8px;font-weight:600}
#pci img.logo{width:42px;height:42px;border-radius:12px;object-fit:contain;background:none}
@media (max-width:640px){#pci .part{grid-template-columns:1fr}#pci .pbox{display:grid;grid-template-columns:112px 1fr;align-items:start}#pci .ph{aspect-ratio:1/1;width:112px;height:112px;margin:10px 0 10px 10px;border-radius:10px;background:#fff}#pci .ph img{object-fit:contain}#pci .ph .sl{top:auto;bottom:4px;left:4px;right:4px;text-align:center;font-size:9.5px;padding:2px 4px}#pci .pbox .pi{padding:10px 12px 12px 14px}#pci a.me{grid-template-columns:76px 1fr;gap:12px}#pci a.me .foto{width:76px;height:76px}#pci .ch{grid-template-columns:1fr}#pci .sl{font-size:10px;left:6px;top:6px}}
@media (max-width:380px){#pci .chr{grid-template-columns:1fr}}
#pci .btn{all:unset;cursor:pointer;font-size:13px;border:1px solid var(--bd);border-radius:999px;padding:5px 12px;color:var(--ink)}
#pci .btn:hover{border-color:var(--ac);color:var(--act)}
#pci .cup{font-family:var(--mono);font-size:12px;color:var(--warnt);border:1px dashed rgba(255,176,32,.5);border-radius:8px;padding:3px 8px}
#pci .old{font-size:12px;color:var(--dim)}
#pci table{width:100%;border-collapse:collapse;font-size:14px}
#pci td{padding:7px 0;border-bottom:1px solid var(--bd)}
#pci td:last-child{text-align:right;font-family:var(--mono)}
#pci tr.t td{font-weight:700;border:0;padding-top:10px;font-size:16px}
#pci ul.ck{list-style:none;display:grid;gap:6px;font-size:14.5px}
#pci ul.ck li::before{content:"✔ ";color:var(--ok)}
#pci ul.ck.dica li::before{content:"💡 "}
#pci ul.no li::before{content:"✖ ";color:#ff8a8a}
#pci .cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
#pci .cta a{text-decoration:none;color:var(--ink);background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:14px;display:block}
#pci .cta a:hover{border-color:var(--ac)}
#pci .cta a b{display:block}
#pci .cta a span{font-size:13px;color:var(--mut)}
#pci .cta a.main{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);border:0}
#pci .cta a.main span{color:#3b1a55}
#pci .foot{color:var(--dim);font-size:12px;margin-top:20px}
#pci .alt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
</style>

/* ---------- Escolha das peças ---------- */
const by = (c,f) => (P[c]||[]).filter(f);
// idade da oferta em dias (em relação ao último post do canal)
const idade = it => it && it.d && DATA.gen ? Math.max(0, Math.round((Date.parse(DATA.gen) - Date.parse(it.d)) / 864e5)) : 0;
// regra do Bruno: preferir oferta recente (mais chance de ainda estar valendo). Oferta velha "custa" ~1% a mais por dia depois de 2 dias.
const efetivo = it => it.p * (1 + .01*Math.max(0, idade(it) - 2));
const cheapest = L => L.slice().sort((a,b)=>efetivo(a)-efetivo(b))[0];
const isG = x => !/Genérica/.test(x.n);

function pickRam(ddr, total){
  const cap = total/2;
  const mods = by('ram', x => x.a.ddr===ddr && x.a.cap===cap && x.a.mods===1 && x.np>=3 && isG(x) && (ddr===4 ? x.a.mhz>=3200 : x.a.mhz>=5200));
  const kits = by('ram', x => x.a.ddr===ddr && x.a.cap===cap && x.a.mods===2 && isG(x) && (ddr===4 ? x.a.mhz>=3200 : x.a.mhz>=5200));
  const m = cheapest(mods), k = cheapest(kits);
  const cls = by('ram', x => x.a.ddr===ddr && x.a.cap===cap && x.a.mods===1);
  const ps = cls.map(x=>x.med).sort((a,b)=>a-b);
  const fx = ps.length ? [ps[Math.floor(ps.length*.25)], ps[Math.floor(ps.length*.75)]] : null;
  if(m && (!k || 2*m.p <= k.p)) return {it:m, preco:2*m.p, qtd:2, fx};
  if(k) return {it:k, preco:k.p, qtd:1, fx: fx && [fx[0]*2, fx[1]*2]};
  return null;
}
function pickMobo(pl, s, cpu, ctx, wifi){
  let L = by('mobo', x => x.a.Plataforma===pl && MARCA_OK.test(x.a.Marca||x.n) && x.np>=4 && (!wifi || x.a['Wi-Fi']==='Com Wi-Fi'));
  let chip, tier;
  if(pl==='AM4'){
    chip = (ctx.orc<4500 && !CPU[cpu].x3d && CPU[cpu].c<=6) ? /A520|B550/ : /B550/;
    tier = (CPU[cpu].x3d || ctx.orc>=8000) ? /TUF|Aorus|Gaming Plus|Phantom|Steel Legend/ : null;
  } else {
    chip = (ctx.orc>=10000 || s.plat==='am5') ? /B850|B650/ : /B650|B850/;

const gpuNear = (name, dir) => {

  return null;
};

    let t = wc ? `Water cooler com radiador de ${r}mm. ${r>=360 ? 'É o que eu uso nos processadores que esquentam (X3D, 7700X, 12 núcleos).' : 'O 240 segura bem os processadores médios.'}` : `Air cooler de torre: simples, silencioso e não tem bomba pra dar problema. Dá conta dos AM4 (menos X3D), dos 6 núcleos AM5 e do 9700X e 7700.`;
    const ok = q ? (wc && r>=360) : true;
    return [t + ' ' + v(ok, ok ? `segura o ${m.cpu} tranquilo.` : `pro ${m.cpu} eu iria de water cooler 360mm.`), undefined, ''];
  }
  if(k==='ca'){
    const c = caseSpec(it.n) || {}, mob = S.mobo && S.mobo.it;
    let t = `${c.tam||''}: cabe placa-mãe ${(c.mobo||[]).filter(x=>x!=='ITX').join('/')}, radiador de até ${c.rad}mm e placa de vídeo de até ${c.gpu}mm. `;
    t += c.tier>=3 ? 'Gabinete de respeito: bom fluxo de ar e espaço pra montar com calma.' : c.tier===2 ? 'Gabinete intermediário, com bastante fan.' : 'Gabinete simples: cumpre o papel em PC de entrada.';
    const ok = !(av.tot>=7000 && (c.tier||0)<3);
    return [t + ' ' + v(ok, ok ? `tudo que você escolheu cabe${mob?' (placa-mãe '+moboTam(mob)+')':''}.` : 'num PC desse valor eu iria de um mid tower melhor.'), [c.tam, 'até '+c.rad+'mm de radiador', 'GPU até '+c.gpu+'mm'], ''];
  }
  return [o.sub, undefined, ''];
}
function mmCompara(av, m){
  const meu = av.meu; if(!meu) return '';
  const gi = n => n && GPU[n] ? GPU[n].i : 0, cg = n => CPU[n] ? CPU[n].g : 0;
  const ganhoG = gi(m.gpu) ? (gi(meu.gpu) - gi(m.gpu)) / gi(m.gpu) : (gi(meu.gpu) ? 1 : 0);
  const ganhoC = (cg(meu.cpu) - cg(m.cpu)) / Math.max(1, cg(m.cpu));
  const ver = `<button class="lnk" id="pciVerMeu" style="color:var(--act);font-weight:600">ver o PC que eu montaria →</button>`;
  const meuNome = `<b>${meu.cpu} + ${meu.apu ? 'vídeo integrado' : meu.gpu}</b>`;
  const igual = meu.cpu===m.cpu && (meu.gpu===m.gpu || (meu.apu && m.gpu==='iGPU'));
  if(ganhoG >= .05) return `<p style="margin-top:10px">Com esse mesmo dinheiro (${R(av.tot)}) eu iria de ${meuNome}: uns <b>${Math.round(ganhoG*100)}% a mais de FPS</b> na placa de vídeo, por ${R(meu.tot)}. ${ver}</p>`;
  if(ganhoG > -.03 && ganhoC > -.03 && av.tot - meu.tot >= 400) return `<p style="margin-top:10px">Dá pra ter o mesmo desempenho gastando menos: com ${meuNome} eu fecho por <b>${R(meu.tot)}</b> (${R(av.tot - meu.tot)} a menos). ${ver}</p>`;
  if(av.alerta.some(x => /gargalo|forte demais/.test(x))) return '';   // o próprio alerta já diz o que trocar
  if(av.alerta.length) return `<p style="margin-top:10px">Processador e placa de vídeo eu manteria iguais. Só ajustaria os pontos acima.</p>`;
  return `<p style="margin-top:10px"><b>Mandou bem:</b> com esse dinheiro, eu não montaria nada muito diferente disso.</p>`;
}
function montar(){
  const m = mmGet(), f = m.f;
  const chip = (k, v, label) => `<button class="it mmf ${(f[k]||'')===v?'on':''}" data-k="${k}" data-v="${v}"><i>${(f[k]||'')===v?'✓':''}</i>${label}</button>`;
  const FILT = {
    mobo: m.pl==='AM4' ? [['chip','','Todos'],['chip','A520','A520'],['chip','B450','B450'],['chip','B550','B550'],['wifi','sim','com Wi-Fi'],['wifi','nao','sem Wi-Fi']] : [['chip','','Todos'],['chip','B650','B650'],['chip','B850','B850'],['wifi','sim','com Wi-Fi'],['wifi','nao','sem Wi-Fi']],
    ram: [['ramcap','16','16GB (2x8)'],['ramcap','32','32GB (2x16)']],
    ssd: [['cap','','Todas'],['cap','500GB','500GB'],['cap','1TB','1TB'],['cap','2TB','2TB'],['intf','Gen3','NVMe PCIe 3.0'],['intf','Gen4','NVMe PCIe 4.0']],
    psu: [['pot','','Todas'],['pot','650','650W+'],['pot','750','750W+'],['pot','850','850W+'],['cert','Bronze','Bronze'],['cert','Gold','Gold'],['mod','full','Full modular']],
    co: [['tipo','','Todos'],['tipo','air','Air cooler'],['tipo','240','Water cooler 240'],['tipo','360','Water cooler 360']],
  };
  if(!f.ramcap) f.ramcap = '16';
  const av = mmAvalia();
  let h = head(false) + `<div class="mmtop"><h2 class="mmh">🛠 Eu sei montar</h2><p class="lead" style="font-size:15px">Escolhe peça por peça. Eu só mostro o que é compatível, com o melhor preço que passou no canal no último mês, e no final avalio o seu PC.</p><button class="lnk" id="pciVoltaGuiado">← prefere que eu monte? Deixa o Brunão montar</button></div>`;
  h += `<div class="mmsec"><div class="mmt"><b>1. Plataforma</b></div><div class="its">${[['AM4','AM4 · DDR4','mais barato hoje'],['AM5','AM5 · DDR5','plataforma nova']].map(o=>`<button class="it mmpl ${m.pl===o[0]?'on':''}" data-v="${o[0]}"><i>${m.pl===o[0]?'✓':''}</i>${o[1]}<small>${o[2]}</small></button>`).join('')}</div></div>`;
  if(m.pl){
    MM_SECS.slice(1).forEach(([sec, nome], i) => {
      const todas = mmOpts(sec).sort((a,b)=>a.preco-b.preco);
      // por padrão só aparece o que é compatível com o que já foi escolhido
      const incomp = todas.filter(o => mmBloq(sec, o) && m[sec]!==o.id);
      const opts = m.incomp===sec ? todas : todas.filter(o => !incomp.includes(o));
      const esc_ = m[sec] && opts.find(o=>o.id===m[sec]);
      const aberto = m.open===sec || !esc_;
      const tem = i===0 || MM_SECS.slice(1, i+1).every(([k]) => m[k]);
      h += `<div class="mmsec ${esc_?'feito':''}" id="mm_${sec}"><div class="mmt"><b>${i+2}. ${nome}</b>${esc_?`<span class="mmsel">${esc(esc_.nome)} · <b>${R2(esc_.preco)}</b></span><button class="lnk mmtroca" data-s="${sec}">trocar</button>`:''}</div>`;
      if(aberto && tem){
        if(FILT[sec]) h += `<div class="its">${FILT[sec].map(c=>chip(...c)).join('')}</div>`;
        if(sec==='ssd') h += `<p class="old" style="margin:-6px 0 8px">SATA não passou no canal no último mês, por isso só aparece NVMe.</p>`;
        if(sec==='ca' && incomp.length && m.incomp!==sec){ const co = (P.cooler||[]).find(x=>x.n===m.co), mob = (P.mobo||[]).find(x=>x.n===m.mobo), g = GPU[m.gpu];
          h += `<p class="old" style="margin:-6px 0 8px">✔ Só gabinetes que cabem ${[mob&&'placa-mãe '+moboTam(mob), co&&radMm(co)&&'water cooler '+radMm(co)+'mm', g&&g.i>=175&&'a '+m.gpu].filter(Boolean).join(', ')}.</p>`; }
        const vis = m.mais===sec ? opts : opts.slice(0, 8);
        h += `<div class="mml">${vis.map(o => { const bl = mmBloq(sec, o); return `<button class="mo ${m[sec]===o.id?'on':''} ${bl?'bl':''}" data-s="${sec}" data-id="${esc(o.id)}" ${bl?'disabled':''}><span class="mon">${esc(o.nome)}<small>${bl?'⚠ '+bl:o.sub}</small></span><span class="mop">${o.preco?R2(o.preco):'R$ 0'}${o.it?`<small>${esc(o.it.loja||'')} · ${idade(o.it)===0?'hoje':idade(o.it)===1?'ontem':'há '+idade(o.it)+' dias'}</small>`:''}</span></button>`; }).join('') || '<p class="old">Nada passou no canal com esse filtro no último mês.</p>'}</div>`;
        if(opts.length > 8 && m.mais!==sec) h += `<button class="lnk mmmais" data-s="${sec}">ver mais ${opts.length-8} opções ▾</button>`;
        if(incomp.length && m.incomp!==sec) h += `<button class="lnk mminc" data-s="${sec}" style="margin-left:14px">ver ${incomp.length} que não ${incomp.length>1?'são compatíveis':'é compatível'} ▾</button>`;
      } else if(!tem) h += `<p class="old">Escolhe a peça anterior primeiro.</p>`;
      h += `</div>`;
    });
  }
  const completo = m.pl && MM_SECS.slice(1).every(([k]) => m[k]);
  h += `<div class="barra mmbar"><div><small>Seu PC até agora</small><b>${R(av.tot)}</b></div>${completo?`<button class="btn mmav" id="pciMMok"><img src="${FOTO_BRUNO}" alt=""><span>Pedir pro Brunão avaliar<small>com as regras das minhas consultorias</small></span></button>`:''}</div>`;
  if(completo && m.ver){
    const S = av.sel;
    h += `<div class="hero" id="mmres"><div class="sub">Seu PC, montado por você</div><div class="tot">${R(av.tot)}</div><div class="mapa">${m.cpu} + ${m.gpu==='iGPU'?'vídeo integrado':m.gpu} + ${S.ram.nome.replace(/^2x /,'2x ')} + ${S.ssd.nome}</div>
      <div class="nota"><b>${String(av.nota).replace('.',',')}</b><span>nota do Brunão</span></div>
      <div class="sv"><button class="btn" id="pciPdf">📄 Salvar em PDF</button><button class="btn" id="pciLink">🔗 Copiar link do meu PC</button></div><div class="pdate">Montado em ${new Date().toLocaleDateString('pt-BR')} · grapetec.com.br</div></div>`;
    h += mapaHTML(true);
    h += `<div class="raio"><div class="mmah"><img src="${FOTO_BRUNO}" alt="Brunão"><div><h3>A avaliação do Brunão</h3><span>Com base nas regras que eu uso nas minhas consultorias</span></div></div>${av.alerta.length?`<ul class="ck no">${av.alerta.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${av.ok.length?`<ul class="ck" style="margin-top:8px">${av.ok.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${av.dica.length?`<ul class="ck dica" style="margin-top:8px">${av.dica.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
      ${mmCompara(av, m)}
      <p class="foot" style="margin-top:10px">Esses são os melhores preços que passaram no meu canal no último mês, depois de uma leitura minuciosa de todas as ofertas. É esse o alvo: entra nos canais e vai pegando cada peça quando ela bater esse preço.</p></div>`;
    h += `<div class="parts">${MM_SECS.slice(1).map(([k, nome]) => { const o = S[k]; if(!o || !o.it) return cardSem(nome, o ? o.nome : '-', o ? o.sub : '', k==='gpu' ? (CPU[m.cpu]&&CPU[m.cpu].apu ? `O ${CPU[m.cpu].apu} roda os competitivos leves (CS2, Valorant, LoL) no gráfico baixo. A placa de vídeo entra depois, sem trocar nada.` : 'Esse vídeo é só pra ligar a tela e usar o PC. Pra jogar, a placa de vídeo precisa vir logo.') : 'O cooler que vem na caixa segura esse processador sem overclock. Confere se a oferta é a versão box (com cooler).', o && o.id==='box' ? 'já incluso' : 'vem no processador');
      const [why, specs, mtr] = mmPeca(k, o, av);
      return card(nome, o.nome, o.preco, o.it, `até <b>${R(o.preco)}</b> tá bom. Faixa normal no mês: ${faixa(o.it.p25*(o.qtd||1), o.it.p75*(o.qtd||1))}.`, why, o.qtd===2 ? `2 pentes × ${R2(o.it.p)}` : '', '', specs, mtr); }).join('')}</div>`;
    h += `<a class="me" href="https://jobrufe.kpages.online/montageminteligente" target="_blank" rel="noopener" id="pciCta"><div class="foto"><img src="${FOTO_BRUNO}" alt="Brunão"></div><div><small>Quer que eu revise pessoalmente?</small><b>ME <u>AJUDA</u>, BRUNÃO</b><span>Essa é a avaliação automática. Na consultoria eu olho o seu caso e te entrego a configuração certinha <b>em até 24h</b>.</span><em>Quero a consultoria →</em></div></a>` + canaisHTML() + `<button class="opt go novo" id="pciMMnovo"><b>↺ Montar outro do zero</b></button>`;
  }
  app.innerHTML = h;
  bindTema(); mmSalva();
  document.getElementById('pciVoltaGuiado').onclick = () => { refaz(); };
  app.querySelectorAll('.mmpl').forEach(b => b.onclick = () => { if(m.pl!==b.dataset.v){ st.mm = {pl:b.dataset.v, f:{}}; } render(); });
  app.querySelectorAll('.mmf').forEach(b => b.onclick = () => { const k = b.dataset.k, v = b.dataset.v; m.f[k] = m.f[k]===v && v ? '' : v; render(); });
  app.querySelectorAll('.mo').forEach(b => b.onclick = () => { const s = b.dataset.s; m[s] = b.dataset.id; m.open = ''; m.ver = false; m.mais = ''; m.incomp = '';
    // trocou algo antes: limpa o que pode ter ficado incompatível
    if(s==='cpu'){ if(m.co==='box') m.co = ''; if(m.gpu==='iGPU' && !(CPU[m.cpu].apu||CPU[m.cpu].igb)) m.gpu = ''; }
    ['psu','ca'].forEach(k => { if(m[k]){ const o = mmOpts(k).find(x=>x.id===m[k]); if(o && mmBloq(k,o)) m[k] = ''; } });
    render(); const nx = MM_SECS.find(([k]) => k!=='pl' && !m[k]); const el = nx && document.getElementById('mm_'+nx[0]); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); });
  app.querySelectorAll('.mmtroca').forEach(b => b.onclick = () => { m.open = b.dataset.s; render(); });
  app.querySelectorAll('.mminc').forEach(b => b.onclick = () => { m.incomp = b.dataset.s; render(); });
  app.querySelectorAll('.mmmais').forEach(b => b.onclick = () => { m.mais = b.dataset.s; render(); });
  const okb = document.getElementById('pciMMok'); if(okb) okb.onclick = () => { m.ver = true; fire('PCIdeal_Manual'); coleta('manual', {total: av.tot, cpu:m.cpu, gpu:m.gpu, nota:av.nota}); render(); const r = document.getElementById('mmres'); if(r) r.scrollIntoView({behavior:'smooth'}); };
  const vm = document.getElementById('pciVerMeu'); if(vm) vm.onclick = () => { st = {itens:{}, parc:30, orc: Math.max(4000, Math.ceil(av.tot/1000)*1000), pag:'pix', jogo:'mix', mres:'fhd', mhz:'144', mon:'fhd', plat:'auto', vis:'perf', net:'cabo', gmodo: m.gpu==='iGPU'?'igpu':'auto'}; step = Q.length; render(); };
  const nv = document.getElementById('pciMMnovo'); if(nv) nv.onclick = () => { st.mm = {pl:'', f:{}}; render(); scrollTo({top: app.getBoundingClientRect().top + scrollY - 80, behavior:'smooth'}); };
  app.querySelectorAll('.mais').forEach(bt => bt.onclick = () => { const pt = bt.closest('.part'); pt.classList.toggle('aberto'); bt.textContent = pt.classList.contains('aberto') ? 'menos detalhes ▴' : 'mais detalhes ▾'; });
  app.querySelectorAll('a[data-ev]').forEach(a => a.addEventListener('click', () => { fire('PCIdeal_manual_'+a.dataset.ev); coleta('clique_'+a.dataset.ev, {modo:'manual'}); }));
  const ct = document.getElementById('pciCta'); if(ct) ct.onclick = () => { fire('PCIdeal_Consultoria'); coleta('consultoria', {modo:'manual', total: av.tot}); };
  const pdf = document.getElementById('pciPdf'); if(pdf) pdf.onclick = () => { fire('PCIdeal_PDF'); window.dispatchEvent(new Event('beforeprint')); setTimeout(() => window.print(), 50); };
  const cl = document.getElementById('pciLink'); if(cl) cl.onclick = () => { try { navigator.clipboard.writeText(location.href); } catch(_){} cl.innerHTML = '✓ link copiado'; };
  app.querySelectorAll('.cupb').forEach(bt => bt.onclick = () => { const c = bt.dataset.c, u = bt.dataset.u; try { navigator.clipboard.writeText(c); } catch(_){} bt.textContent = '✓ copiado'; if(u) window.open(u, '_blank', 'noopener'); });
}

// salva o PC montado à mão no link (#mm=) — só os nomes das peças
const MM_K = ['pl','cpu','mobo','ram','ssd','gpu','psu','co','ca'];
function mmSalva(){ const m = mmGet(), o = {}; MM_K.forEach(k => { if(m[k]) o[k] = m[k]; }); if(m.f && m.f.ramcap) o.rc = m.f.ramcap;
  try { history.replaceState(null, '', location.pathname + location.search + (o.pl ? '#mm=' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'') : '#montar')); } catch(_){} }
function mmLe(c){ try { const o = JSON.parse(decodeURIComponent(escape(atob(c)))); if(!o || !o.pl) return null; const m = {f:{ramcap:o.rc||'16'}}; MM_K.forEach(k => { if(o[k]) m[k] = o[k]; });
  // se alguma peça sumiu do banco (oferta saiu dos 30 dias), deixa em branco pra escolher de novo
  st.mm = m; MM_K.slice(1).forEach(k => { if(m[k] && !mmOpts(k).some(x => x.id===m[k])) delete m[k]; }); m.ver = MM_K.slice(1).every(k => m[k]); return m; } catch(_){ return null; } }

/* ---------- PDF: tira o "esticar até a borda" do WordPress antes de imprimir ---------- */
(function(){
  const root = document.getElementById('pci'); let antes = null;
  const tira = () => { if(!root || antes!==null) return; antes = root.getAttribute('style')||''; root.setAttribute('style','margin:0!important;width:100%!important;max-width:100%!important;left:0!important'); };
  const volta = () => { if(!root || antes===null) return; root.setAttribute('style', antes); antes = null; window.dispatchEvent(new Event('resize')); };
  window.addEventListener('beforeprint', tira); window.addEventListener('afterprint', volta);
  if(window.matchMedia){ const mq = matchMedia('print'); const f = e => e.matches ? tira() : volta(); mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f); }
})();
/* ---------- salvar / restaurar o projeto ---------- */
const CHAVES = ['itens','gmodo','itipo','gfut','mtam','orc','pag','parc','jogo','mres','mhz','mpan','mon','plat','vis','net'];
function codifica(){ const o = {}; CHAVES.forEach(k => { if(st[k]!==undefined) o[k] = st[k]; }); return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,''); }
function salvos(){ try { const L = JSON.parse(localStorage.getItem('pcideal_salvos')||'[]'); return Array.isArray(L) ? L : []; } catch(_){ return []; } }
function gravaSalvos(L){ try { localStorage.setItem('pcideal_salvos', JSON.stringify(L.slice(0,10))); } catch(_){} }
function salva(info){
  const c = codifica();
  try { history.replaceState(null, '', location.pathname + location.search + '#pc=' + c); } catch(_){}
  if(info){ const L = salvos().filter(x => x.c !== c); L.unshift(Object.assign({c, quando:new Date().toISOString()}, info)); gravaSalvos(L); }
}
function le(c){ try { const o = JSON.parse(decodeURIComponent(escape(atob(c)))); return o && o.orc && o.jogo && o.vis && o.net ? o : null; } catch(_){ return null; } }
function refaz(){ st = {itens:{}, parc:30}; step = 0; try { history.replaceState(null, '', location.pathname + location.search); } catch(_){} render(); }
fire('PCIdeal_Visita');
const hm = (location.hash.match(/#pc=([A-Za-z0-9+/]+)/)||[])[1];
const doLink = hm && le(hm);
if(doLink){ st = Object.assign({itens:{}, parc:30}, doLink); step = Q.length; fire('PCIdeal_Reaberto'); }
else if(/^#(montar|mm=)/.test(location.hash)){ st.modo = 'manual'; const mc = (location.hash.match(/#mm=([A-Za-z0-9+/]+)/)||[])[1]; if(mc) mmLe(mc); }
render();
})();
</script>
